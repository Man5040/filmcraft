# Builds only the browser version of FilmCraft and publishes it as an artifact.
# Added by Man5040/estudio on the `bridge` branch; upstream code is unchanged.
# Toolchain as in upstream's docs/web.md; the build itself is `cargo xtask web`.
name: web build

on:
  push:
    branches: [bridge]
  workflow_dispatch:

concurrency:
  group: web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Must match the `wasm-bindgen` crate version exactly (docs/web.md).
      WASM_BINDGEN_VERSION: 0.2.129
      # Pinned recent binaryen for wasm-opt (see the install step).
      BINARYEN_VERSION: version_133
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web-build
          cache-on-failure: true
      - name: Install wasm-bindgen CLI and wasm-opt
        run: |
          name="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl"
          base="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}"
          curl -fsSLO "$base/$name.tar.gz"
          curl -fsSLO "$base/$name.tar.gz.sha256sum"
          # The .sha256sum file names the tarball under a gh-release/ path: compare the hash only.
          echo "$(cut -d' ' -f1 "$name.tar.gz.sha256sum")  $name.tar.gz" | sha256sum -c -
          tar -xzf "$name.tar.gz"
          install -m 0755 "$name/wasm-bindgen" "$HOME/.cargo/bin/"
          wasm-bindgen --version
          # Optional size optimisation used by `cargo xtask web` when present. A pinned, recent
          # binaryen: Ubuntu's packaged one renumbers the tables, so the `__wbindgen_externrefs`
          # export pointed at the fixed-size function table and the app failed at start
          # ("WebAssembly.Table.grow(): failed to grow table by 4"). docs/web.md: "any recent".
          b="binaryen-${BINARYEN_VERSION}"
          curl -fsSLO "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/$b-x86_64-linux.tar.gz"
          curl -fsSLO "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/$b-x86_64-linux.tar.gz.sha256"
          echo "$(cut -d' ' -f1 "$b-x86_64-linux.tar.gz.sha256")  $b-x86_64-linux.tar.gz" | sha256sum -c -
          tar -xzf "$b-x86_64-linux.tar.gz"
          install -m 0755 "$b/bin/wasm-opt" "$HOME/.cargo/bin/"
          cp -r "$b/lib/." "$HOME/.cargo/lib/" 2>/dev/null || { mkdir -p "$HOME/.cargo/lib" && cp -r "$b/lib/." "$HOME/.cargo/lib/"; }
          export LD_LIBRARY_PATH="$HOME/.cargo/lib:${LD_LIBRARY_PATH:-}"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          wasm-opt --version
      - name: Build
        run: cargo xtask web
      - name: Package
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "filmcraft-web"))')"
          dist="$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')/web/dist"
          name="filmcraft-web-$version"
          mkdir -p out && cp -r "$dist" "out/$name"
          # Served to browsers = distributed: the licenses travel with it (as in PhotoCraft's zip).
          cp LICENSE-* "out/$name/"
          (cd out && zip -qr9 "$name.zip" "$name")
          {
            echo "### FilmCraft web"
            echo
            echo '```'
            ls -l out/*.zip "out/$name"/*.wasm
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: filmcraft-web
          path: out/filmcraft-web-*.zip
          if-no-files-found: error
          retention-days: 90
