# Builds only the browser version of FilmCraft and publishes it as an artifact.
# Added by Man5040/estudio on the `bridge` branch; upstream code is unchanged.
# Toolchain as in upstream's docs/web.md; the build itself is `cargo xtask web`.
name: web build

on:
  push:
    branches: [bridge]
  workflow_dispatch:

concurrency:
  group: web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Must match the `wasm-bindgen` crate version exactly (docs/web.md).
      WASM_BINDGEN_VERSION: 0.2.129
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web-build
          cache-on-failure: true
      - name: Install wasm-bindgen CLI and wasm-opt
        run: |
          name="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl"
          base="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}"
          curl -fsSLO "$base/$name.tar.gz"
          curl -fsSLO "$base/$name.tar.gz.sha256sum"
          # The .sha256sum file names the tarball under a gh-release/ path: compare the hash only.
          echo "$(cut -d' ' -f1 "$name.tar.gz.sha256sum")  $name.tar.gz" | sha256sum -c -
          tar -xzf "$name.tar.gz"
          install -m 0755 "$name/wasm-bindgen" "$HOME/.cargo/bin/"
          wasm-bindgen --version
          # Optional size optimisation used by `cargo xtask web` when present.
          sudo apt-get update -q && sudo apt-get install -yq binaryen
          wasm-opt --version
      - name: Build
        run: cargo xtask web
      - name: Package
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "filmcraft-web"))')"
          dist="$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')/web/dist"
          name="filmcraft-web-$version"
          mkdir -p out && cp -r "$dist" "out/$name"
          (cd out && zip -qr9 "$name.zip" "$name")
          {
            echo "### FilmCraft web"
            echo
            echo '```'
            ls -l out/*.zip "out/$name"/*.wasm
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: filmcraft-web
          path: out/filmcraft-web-*.zip
          if-no-files-found: error
          retention-days: 90
